name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Test verifier behavior
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify structure and drafts
        run: python scripts/verify.py

